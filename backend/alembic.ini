# Alembic — how the database schema is changed safely.
#
# Every change to a table or column is written down here as a numbered step,
# so a server holding real customer data can be brought up to date without
# ever being wiped. Run migrations with:
#
#     python migrate.py            bring the database up to date
#     python migrate.py --status   show where the database currently is
#
# The database address is deliberately NOT in this file: it is read from
# .env by database.py, so no password is ever committed to the repository.

[alembic]
script_location = migrations
prepend_sys_path = .
# How to split prepend_sys_path. Distinct from version_path_separator
# below, despite the name; without it alembic warns and guesses.
path_separator = os
version_path_separator = os

# Migration files are named  0001_short_description.py, in order, so the
# history reads as a list rather than as random letters and numbers.
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
