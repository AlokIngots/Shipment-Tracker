[pytest]
testpaths = tests
# Quiet, but a failure still shows the line and the values behind it.
addopts = -q --tb=short
# A warning from our OWN code is an error: it is how a deprecation gets
# noticed before it becomes a breakage. Warnings from libraries we do not
# control are silenced by name, never wholesale, so a new one still shows up.
filterwarnings =
    error::DeprecationWarning:app.*
    error::DeprecationWarning:scripts.*
    ignore:Using `httpx` with `starlette.testclient` is deprecated
    ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning
