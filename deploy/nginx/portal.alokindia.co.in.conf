# nginx site for the customer portal, on a server that already runs
# something else — srv1427359 also runs AlokCRM.
#
# This is a NEW file. Nothing about the existing CRM configuration is
# edited, included, or reloaded over. Install it:
#
#   sudo cp deploy/nginx/portal.alokindia.co.in.conf \
#           /etc/nginx/sites-available/portal.alokindia.co.in
#   sudo ln -s /etc/nginx/sites-available/portal.alokindia.co.in \
#              /etc/nginx/sites-enabled/
#   sudo nginx -t          # MUST pass before the next line
#   sudo systemctl reload nginx
#
# If `nginx -t` fails, remove the symlink and reload nothing. nginx only
# reads a config on reload, so a broken file cannot reach the CRM.
#
# Then obtain the certificate, scoped to this domain alone so certbot edits
# only this file:
#
#   sudo certbot --nginx -d portal.alokindia.co.in
#
# certbot rewrites the server block below to listen on 443, adds the
# certificate lines, and adds a redirect from 80. That is expected.

server {
    listen 80;
    listen [::]:80;
    server_name portal.alokindia.co.in;

    # The portal accepts uploads up to 20 MB (a scanned Mill Test
    # Certificate is easily several). nginx defaults to 1 MB and would
    # refuse anything larger with a bare 413 that says nothing useful.
    client_max_body_size 25m;

    # A large scan over a slow line from an export office should not be cut
    # off half way.
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    location / {
        # 8090, not 8080: 8080 on this machine is alok-crm-frontend.
        # The portal binds this port on loopback only, so nothing here is
        # reachable from outside except through nginx.
        proxy_pass http://127.0.0.1:8090;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;

        # $remote_addr, deliberately NOT $proxy_add_x_forwarded_for.
        #
        # The second appends to whatever the caller sent, so a visitor could
        # put any address they liked at the front of the list. nginx is the
        # first hop here, so it should state the address it actually sees
        # and discard the rest. The portal's rate limiter depends on this
        # being true: get it wrong and one visitor can spend another's
        # budget, or dodge their own.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Caddy inside the portal then appends its own hop, so the API sees
        # "<client>, <docker bridge>" and is configured with
        # TRUSTED_PROXY_HOPS=2 to count past it. Confirm after deploying, as
        # staff, from outside the server:
        #
        #   GET https://portal.alokindia.co.in/api/staff/whoami
        #
        # client_address must be your own public IP. If it is not, the rate
        # limiter is measuring the wrong thing and nothing will look broken
        # until one attacker locks out every customer at once.
    }
}
